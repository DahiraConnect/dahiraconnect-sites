# Cloudflare Workers — site statique pré-généré (npm run build)
# Le nom doit être celui du Worker créé dans le tableau de bord Cloudflare.
name = "dahiraconnect"
compatibility_date = "2026-11-13"

[assets]
directory = "./dist/dahiraconnect/browser"
# Adresse inconnue : 404.html avec le statut 404
not_found_handling = "404-page"
# /agenda/index.html servi sur /agenda/
html_handling = "auto-trailing-slash"
