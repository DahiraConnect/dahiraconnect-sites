# Vérification automatique : tests et build de production à chaque envoi sur GitHub.
# En cas d'échec, GitHub prévient par e-mail (et la case est rouge sur le commit).
name: Vérification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Tests
        run: npx ng test --watch=false --browsers=ChromeHeadless
      - name: Build de production
        run: npm run build
