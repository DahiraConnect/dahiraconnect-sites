<dialog #dialog class="cr" aria-labelledby="cr-title" (cancel)="close()">
  <h2 id="cr-title" class="cr__title">Cadrer la photo</h2>
  <p class="cr__help">Faites glisser la photo pour placer le visage au centre, puis zoomez si besoin.</p>

  <div class="cr__frame" [style.width.px]="frame" [style.height.px]="frame" tabindex="0" role="application"
    aria-label="Cadre de la photo : flèches du clavier pour déplacer"
    (pointerdown)="down($event)" (pointermove)="move($event)" (pointerup)="up()" (pointercancel)="up()" (keydown)="key($event)">
    <img #img class="cr__img" [src]="src()" alt="" draggable="false" (load)="onLoad(img)" [style]="imgStyle()" />
    <span class="cr__ring" aria-hidden="true"></span>
  </div>

  <label class="cr__zoom">
    <i class="ph ph-magnifying-glass-minus" aria-hidden="true"></i>
    <span class="sr-only">Zoom</span>
    <input type="range" min="1" max="3" step="0.05" [value]="zoom()" (input)="onZoom($any($event.target).value)" />
    <i class="ph ph-magnifying-glass-plus" aria-hidden="true"></i>
  </label>

  <div class="cr__actions">
    <button type="button" class="btn btn--outline btn--sm" (click)="close()">Annuler</button>
    <button type="button" class="btn btn--dark btn--sm" (click)="confirm()" [disabled]="!natural()">
      <i class="ph ph-check" aria-hidden="true"></i> Valider
    </button>
  </div>
</dialog>
