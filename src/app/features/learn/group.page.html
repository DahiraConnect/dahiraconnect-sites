@if (group(); as g) {
  <app-dark-hero>
    <div class="hero">
      <a class="hero__back rise" routerLink="/apprendre">
        <i class="ph ph-arrow-left" aria-hidden="true"></i>
        Tous les thèmes
      </a>
      <h1 class="hero__title hero__title--group rise" style="--i: 1">{{ g.title }}</h1>
      <p class="hero__lead rise" style="--i: 2">{{ g.description }}</p>
    </div>
  </app-dark-hero>

  <div class="sheet container">
    <ul class="themes">
      @for (t of parts(); track t.id; let i = $index) {
        <li appReveal [appRevealDelay]="i * 90">
          <app-theme-card [theme]="t" />
        </li>
      }
    </ul>
  </div>
}
