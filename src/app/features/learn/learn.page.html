<app-dark-hero>
  <div class="hero">
    <p class="overline hero__overline rise">Écouter, puis jouer</p>
    <h1 class="hero__title rise" style="--i: 1">Apprendre</h1>
    @if (quiz(); as q) {
      <p class="hero__lead rise" style="--i: 2">{{ q.intro }}</p>
    }
    @if (categories().length > 1) {
      <div class="hero__chips rise" style="--i: 3" role="group" aria-label="Filtrer par catégorie">
        <button type="button" class="chip" [attr.aria-pressed]="category() === ''" (click)="category.set('')">Tout</button>
        @for (c of categories(); track c) {
          <button type="button" class="chip" [attr.aria-pressed]="category() === c" (click)="category.set(c)">{{ c }}</button>
        }
      </div>
    }
  </div>
</app-dark-hero>

<div class="sheet container">
  <div class="lang-select">
    <label class="lang-select__label" for="langue">
      <i class="ph ph-globe-simple" aria-hidden="true"></i>
      Langue
    </label>
    <select id="langue" class="lang-select__field" [value]="language()" (change)="choose($any($event.target).value)">
      @for (l of offered(); track l) {
        <option [value]="l" [selected]="l === language()">{{ names[l] }}</option>
      }
    </select>
  </div>
  <!-- Après un changement : on confirme ce qui va se passer, dans la langue choisie -->
  <p class="lang-select__note" role="status" [attr.lang]="noteLang()" [attr.dir]="noteLang() === 'ar' ? 'rtl' : null">{{ note() }}</p>

  @if (shown().length) {
    <ul class="themes">
      @for (t of shown(); track t.id; let i = $index) {
        <li appReveal [appRevealDelay]="i * 90">
          <app-theme-card [theme]="t" />
        </li>
      }
    </ul>
  } @else {
    <p class="empty">Les leçons arrivent bientôt.</p>
  }
</div>
