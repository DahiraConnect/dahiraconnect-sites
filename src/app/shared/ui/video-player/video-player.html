<div class="player" [class.player--vertical]="video().vertical">
  @if (playing() && embed(); as src) {
    <iframe
      class="player__frame"
      [src]="src"
      [title]="title()"
      allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
      allowfullscreen
    ></iframe>
  } @else {
    @if (poster(); as img) {
      <img class="player__poster" [ngSrc]="img" alt="" fill sizes="(min-width: 1024px) 60vw, 100vw" />
    } @else {
      <span class="player__brand" aria-hidden="true"><i class="ph {{ icon() }}"></i></span>
    }
    @if (embed()) {
      <button type="button" class="player__play" (click)="playing.set(true)">
        <i class="ph-fill ph-play" aria-hidden="true"></i>
        <span class="sr-only">Lire la vidéo « {{ title() }} »</span>
      </button>
    } @else {
      <a class="player__play" [href]="video().url" target="_blank" rel="noopener">
        <i class="ph-fill ph-play" aria-hidden="true"></i>
        <span class="sr-only">Regarder « {{ title() }} » sur {{ video().label }}</span>
      </a>
    }
  }
</div>

<a class="btn btn--outline btn--sm player__open" [href]="video().url" target="_blank" rel="noopener">
  <i class="ph {{ icon() }}" aria-hidden="true"></i>
  Ouvrir dans {{ video().label }}
</a>
