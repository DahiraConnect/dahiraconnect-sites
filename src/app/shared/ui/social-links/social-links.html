@if (links().length) {
  <ul class="social__list">
    @for (link of links(); track link.url) {
      <li>
        <a class="social__link" [href]="link.url" target="_blank" rel="noopener me">
          <i class="ph {{ link.icon }}" aria-hidden="true"></i>
          @if (variant() === 'list') {
            <span class="social__text">
              <span class="social__name">{{ link.label }}</span>
              @if (link.handle) {
                <span class="social__handle">{{ link.handle }}</span>
              }
            </span>
            <i class="ph ph-arrow-up-right social__out" aria-hidden="true"></i>
          } @else {
            <span class="sr-only">{{ link.label }}</span>
          }
        </a>
      </li>
    }
  </ul>
}
